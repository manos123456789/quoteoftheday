<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quote of the Day</title>
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>

<body>
  <div class="container">
    <div class="quote-box">
      <h1 class="title">Quote of the Day</h1>
      
      <div class="quote-content">
        <div class="quote-icon">"</div>
        <p class="quote-text" id="quote">Click the button below to get an inspiring quote!</p>
        <p class="quote-author" id="author"></p>
      </div>
      
      <button class="new-quote-btn" id="newQuoteBtn">New Quote</button>
      
      <div class="loading" id="loading">Loading...</div>
    </div>
  </div>
  
  <script src="script.js"></script>
</body>

</html>
